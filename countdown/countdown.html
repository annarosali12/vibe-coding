<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadata configuration setting encoding and responsive viewport scaling for mobile devices -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elinor's 1st Birthday Countdown 🐾</title>

    <style>
        /* CSS RESET & DESIGN VARIABLES */
        /* Defines reusable color palettes, fonts, and dimensions used throughout the page layout */
        :root {
            --primary-color: #ff6b8b;
            --secondary-color: #ffa8ba;
            --background-color: #fff0f5;
            --card-background: #ffffff;
            --text-color: #4a3b32;
            --accent-color: #ffd166;
            --border-radius: 24px;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Resets margin, padding, and box-sizing for all HTML elements to ensure consistent rendering */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Base styles for the entire page body including centering and kitten paw background pattern */
        body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            /* Creates a repeating pattern of subtle pink dots reminiscent of kitten paw pads */
            background-image: radial-gradient(#ffa8ba 15%, transparent 16%),
                              radial-gradient(#ffa8ba 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* MAIN CARD CONTAINER */
        /* Styles the central white card frame containing the countdown elements */
        main {
            background: var(--card-background);
            border: 6px solid var(--secondary-color);
            border-radius: var(--border-radius);
            padding: 40px 30px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 107, 139, 0.2);
            position: relative;
            margin-top: 20px;
        }

        /* KITTEN EARS DESIGN */
        /* Container positioning for the decorative kitten ears attached to the top of the card */
        .cat-ears {
            position: absolute;
            top: -50px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
            pointer-events: none;
        }

        /* Creates the outer triangular ear shapes using CSS borders */
        .ear {
            width: 0;
            height: 0;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 55px solid var(--secondary-color);
            position: relative;
        }

        /* Creates the inner pink triangle of each ear */
        .ear::after {
            content: '';
            position: absolute;
            top: 15px;
            left: -22px;
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-bottom: 32px solid var(--primary-color);
        }

        /* HEADER TYPOGRAPHY */
        /* Styling for the main heading title */
        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        /* Styling for the subtitle date text below the heading */
        .subtitle {
            font-size: 1.25rem;
            color: var(--text-color);
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* COUNTDOWN GRID DISPLAY */
        /* Responsive CSS grid layout holding the four timer boxes */
        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Styles individual countdown boxes that surround each number unit */
        .time-card {
            background-color: var(--background-color);
            border: 3px dashed var(--secondary-color);
            border-radius: 16px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LARGE NUMBERS DISPLAY */
        /* Styles the prominent numerical countdown digits */
        .number {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
        }

        /* Styles the labels beneath each number (Days, Hours, Minutes, Seconds) */
        .label {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            color: var(--text-color);
        }

        /* CELEBRATION MESSAGE DISPLAY */
        /* Special text formatting for the final birthday message replacing the timer */
        .celebration-message {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-color);
            padding: 30px 10px;
            animation: bounce 1s infinite alternate;
        }

        /* Creates a fun jumping animation for the celebration text when triggered */
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* DECORATIVE PAW FOOTER */
        /* Styles the row of paw print emojis at the bottom of the card */
        .decorations {
            font-size: 1.8rem;
            margin-top: 10px;
            user-select: none;
        }

        /* VISUALLY HIDDEN CLASS FOR ACCESSIBILITY (SCREEN READERS) */
        /* Hides text visually while keeping it fully readable for assistive technology like screen readers */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* RESPONSIVE DESIGN FOR SMALLER SCREENS */
        /* Adjusts layout structure and font sizes automatically for smartphones and small displays */
        @media (max-width: 650px) {
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .number {
                font-size: 3rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .celebration-message {
                font-size: 1.8rem;
            }

            .cat-ears {
                padding: 0 30px;
            }
        }
    </style>
</head>
<body>

    <!-- Semantic container element providing accessibility focus and screen reader descriptions -->
    <main tabindex="0" aria-labelledby="title" aria-describedby="live-status">
        
        <!-- Decorative kitten ears component hidden from screen readers to prevent distraction -->
        <div class="cat-ears" aria-hidden="true">
            <div class="ear"></div>
            <div class="ear"></div>
        </div>

        <!-- Header section containing the card title and target date information -->
        <header>
            <h1 id="title">🐾 Elinor's 1st Birthday Countdown 🐾</h1>
            <p class="subtitle">Counting down to May 29, 2027 🎂</p>
        </header>

        <!-- Hidden live status region allowing screen readers to hear periodic time updates -->
        <div id="live-status" class="sr-only" aria-live="polite"></div>

        <!-- Visible countdown grid display containing the four dynamic time units -->
        <div class="countdown-grid" id="countdown-display" role="region" aria-label="Time remaining countdown timer">
            
            <!-- Box display for days -->
            <div class="time-card">
                <span class="number" id="days" aria-label="Days">000</span>
                <span class="label" aria-hidden="true">Days</span>
            </div>

            <!-- Box display for hours -->
            <div class="time-card">
                <span class="number" id="hours" aria-label="Hours">00</span>
                <span class="label" aria-hidden="true">Hours</span>
            </div>

            <!-- Box display for minutes -->
            <div class="time-card">
                <span class="number" id="minutes" aria-label="Minutes">00</span>
                <span class="label" aria-hidden="true">Minutes</span>
            </div>

            <!-- Box display for seconds -->
            <div class="time-card">
                <span class="number" id="seconds" aria-label="Seconds">00</span>
                <span class="label" aria-hidden="true">Seconds</span>
            </div>

        </div>

        <!-- Decorative paw and fish emoji footer -->
        <footer class="decorations" aria-hidden="true">
            🐾 🐟 🐾 🐟 🐾
        </footer>

    </main>

    <script>
        // v1.1 - Added celebration message replacing numbers at zero and enhanced descriptive comments

        // BLOCK 1: TARGET DATE SETUP
        // Define the target timestamp for Elinor's 1st Birthday: May 29, 2027 at Midnight (in milliseconds).
        const TARGET_DATE = new Date('May 29, 2027 00:00:00').getTime();

        // BLOCK 2: DOM ELEMENT REFERENCES
        // Grab elements from the HTML page using their IDs so JavaScript can update their contents.
        const daysElement = document.getElementById('days');
        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');
        const liveStatusElement = document.getElementById('live-status');
        const countdownDisplay = document.getElementById('countdown-display');

        // BLOCK 3: HELPER FUNCTION FOR ZERO PADDING
        // Formats single-digit numbers so they always show with a leading zero (for example, '05' instead of '5').
        function formatTime(time) {
            return time < 10 ? `0${time}` : time;
        }

        // BLOCK 4: MAIN TIMER FUNCTION
        // Calculates the remaining time between the current moment and the target birthday date.
        function updateCountdown() {
            // Get current time stamp in milliseconds
            const now = new Date().getTime();
            
            // Calculate remaining milliseconds until the target birthday date
            const timeDifference = TARGET_DATE - now;

            // BLOCK 5: CELEBRATION TRIGGER CHECK
            // Checks if the countdown timer has reached zero or passed.
            if (timeDifference <= 0) {
                // Stop the timer from running continuously
                clearInterval(timerInterval);

                // Completely replace the numbers display with the festive birthday celebration message
                countdownDisplay.innerHTML = `<div class="celebration-message">🎉 Happy Birthday, Elinor! 🎉</div>`;

                // Update accessibility live region status for screen reader users
                liveStatusElement.textContent = "Happy Birthday, Elinor! The countdown has reached zero!";
                return;
            }

            // BLOCK 6: TIME UNIT CONVERSIONS
            // Convert the remaining milliseconds into individual standard units: days, hours, minutes, and seconds
            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            // BLOCK 7: DOM UPDATES
            // Insert the calculated time values into the visible numbers on the page
            daysElement.textContent = days;
            hoursElement.textContent = formatTime(hours);
            minutesElement.textContent = formatTime(minutes);
            secondsElement.textContent = formatTime(seconds);

            // Update the hidden text description to keep screen readers updated continuously
            liveStatusElement.textContent = `${days} days, ${hours} hours, ${minutes} minutes, and ${seconds} seconds remaining until Elinor's birthday.`;
        }

        // BLOCK 8: TIMER INITIALIZATION
        // Execute the countdown function immediately when the page loads so there is no 1-second display delay
        updateCountdown();

        // BLOCK 9: REPEATING INTERVAL TIMER
        // Set up an automatic loop that runs the updateCountdown function every 1000 milliseconds (1 second)
        const timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
