<!DOCTYPE html>
<!--
  ============================================================================
  Googly Eyes Mirror
  ============================================================================
  v1.0 - initial build: camera mirror, MediaPipe face tracking, googly eyes
         with physics-driven wobbling pupils.

  LIBRARIES AND EXTERNAL FILES (all loaded in the browser, pinned to exact versions):

  1. @mediapipe/tasks-vision  v0.10.21
     Source : jsDelivr CDN (npm package published by Google)
              https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs
     Purpose: Google's MediaPipe Tasks Vision library. It provides the
              "Face Landmarker", which finds a face in each video frame and
              returns 478 landmark points (eye corners, nose, lips, etc.).

  2. MediaPipe WebAssembly runtime  v0.10.21  (part of the same package)
     Source : https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm
     Purpose: The compiled engine that actually runs the face model quickly
              inside the browser.

  3. face_landmarker.task  (float16, model version 1)
     Source : Google's official MediaPipe model storage
              https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
     Purpose: The trained face model file. It is only DOWNLOADED. Your camera
              images are never uploaded anywhere: all face tracking happens
              locally on your device.

  PRIVACY: No video, image, or data is sent to any server. The only network
  traffic is downloading the three files above.
  ============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Googly Eyes Mirror</title>

  <style>
    /* ------------------------------------------------------------------
       Design tokens: one place to change colours, sizes and fonts.
       ------------------------------------------------------------------ */
    :root {
      --ink: #1d1a2b;          /* deep aubergine background */
      --ink-soft: #2b2740;     /* panels and the camera frame */
      --paper: #f7f3e8;        /* warm white for text */
      --paper-dim: #c9c4d8;    /* secondary text */
      --go: #ffd23f;           /* Start button: sunny yellow */
      --go-text: #1d1a2b;
      --stop: #ff5d73;         /* Stop button: coral */
      --stop-text: #1d1a2b;
      --focus: #6be3ff;        /* bright focus ring, easy to see */
      --radius: 18px;
      --font: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      /* Width / height of the camera picture. JavaScript updates it
         once the real camera size is known. */
      --ratio: 1.3333;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 32px;
      /* Keep content clear of phone notches and home bars. */
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    header { text-align: center; max-width: 40rem; }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.8rem, 6vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .intro { margin: 0 0 18px; color: var(--paper-dim); }

    /* ---------- Buttons ---------- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 18px;
    }

    button {
      font: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      min-height: 48px;            /* comfortable touch target */
      min-width: 150px;
      padding: 10px 24px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    #startBtn { background: var(--go);   color: var(--go-text); }
    #stopBtn  { background: var(--stop); color: var(--stop-text); }

    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Clear keyboard focus ring on every focusable thing. */
    button:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 3px;
    }

    /* ---------- Camera stage ---------- */
    .stage {
      position: relative;
      /* As wide as possible, but never taller than 70% of the screen. */
      width: min(100%, calc(70vh * var(--ratio)), 960px);
      aspect-ratio: var(--ratio);
      background: var(--ink-soft);
      border-radius: var(--radius);
      overflow: hidden;
      border: 3px solid #4a4468;
    }

    /* The video and the eyes canvas are stacked and BOTH flipped
       left-to-right, so the picture acts like a real mirror. */
    .stage video,
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .stage video { object-fit: fill; background: transparent; }

    /* Message shown on the stage while the camera is off. */
    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: var(--paper-dim);
      font-size: clamp(1rem, 3.5vw, 1.4rem);
    }

    /* Small badge on the picture (not read aloud: the status line below is). */
    .badge {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      background: rgba(29, 26, 43, 0.85);
      color: var(--paper);
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      white-space: nowrap;
    }

    [hidden] { display: none !important; }

    /* ---------- Status line (screen readers announce changes) ---------- */
    .status {
      margin: 16px 0 0;
      min-height: 1.6em;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .status.error { color: var(--stop); }

    footer { margin-top: 20px; color: var(--paper-dim); font-size: 0.9rem; text-align: center; max-width: 36rem; }

    /* Utility: visible only to screen readers. */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>Googly Eyes Mirror</h1>
    <p class="intro">Start the camera, then shake your head to make the pupils swing.</p>
  </header>

  <main style="width:100%; display:flex; flex-direction:column; align-items:center;">
    <!-- Camera on / off controls -->
    <div class="controls" role="group" aria-label="Camera controls">
      <button id="startBtn" type="button" aria-label="Start camera">Start Camera</button>
      <button id="stopBtn" type="button" aria-label="Stop camera" disabled>Stop Camera</button>
    </div>

    <!-- The mirror: live video with googly eyes drawn on top -->
    <section class="stage" id="stage" aria-label="Camera mirror with googly eyes">
      <video id="video" autoplay muted playsinline aria-label="Your live camera, shown as a mirror"></video>
      <canvas id="eyes" role="img" aria-label="Googly eyes drawn over your eyes"></canvas>
      <div class="placeholder" id="placeholder">The camera is off. Press Start Camera to begin.</div>
      <div class="badge" id="badge" hidden aria-hidden="true"></div>
    </section>

    <!-- Live status message, announced by screen readers when it changes -->
    <p class="status" id="status" role="status" aria-live="polite">Camera is off.</p>
  </main>

  <footer>
    Everything runs in your browser. Your camera pictures never leave this device.
  </footer>

<script type="module">
  // v1.0 - initial build

  /* =====================================================================
     SECTION 1: SETTINGS
     Numbers you can tweak to change how the eyes look and behave.
     ===================================================================== */

  // Web addresses of the pinned MediaPipe files (see the comment at the top).
  const MEDIAPIPE_MODULE_URL =
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";
  const MEDIAPIPE_WASM_URL =
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm";
  const FACE_MODEL_URL =
    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

  // Which face landmark numbers mark the corners of each eye.
  // (The model numbers landmarks as seen in the un-mirrored camera image.)
  const EYE_CORNERS = {
    first:  { a: 33,  b: 133 },  // the eye on the left side of the raw image
    second: { a: 362, b: 263 }   // the eye on the right side of the raw image
  };

  // Googly eye size. Radius is a bit bigger than the real eye is wide,
  // but never larger than this share of the distance between the eyes
  // (so the two googly eyes never overlap).
  const EYE_SIZE_FROM_EYE_WIDTH = 0.95;
  const EYE_MAX_SHARE_OF_EYE_GAP = 0.48;

  // The black pupil is this fraction of the eye's radius.
  const PUPIL_SIZE = 0.48;

  // Physics for the loose pupils (all distances measured in "eye radii").
  const GRAVITY = 16;            // how hard gravity pulls the pupil down (radii per second squared)
  const SHAKE_GAIN = 1.0;        // how strongly head movement flings the pupil
  const MAX_SHAKE = 140;         // upper limit on shake force, so tracking glitches can't launch pupils
  const AIR_DRAG = 1.6;          // slows the pupil down over time (higher = less swingy)
  const BOUNCE = 0.65;           // how bouncy the eye wall is (0 = sticky, 1 = perfectly bouncy)
  const PHYSICS_STEPS = 3;       // tiny sub-steps per video frame for smoother motion

  // How much to smooth tracked positions. 1 = no smoothing, lower = smoother but laggier.
  const POSITION_SMOOTHING = 0.6;
  const SIZE_SMOOTHING = 0.3;

  /* =====================================================================
     SECTION 2: PAGE ELEMENTS
     Grab every element we need to talk to, once, up front.
     ===================================================================== */
  const startBtn    = document.getElementById("startBtn");
  const stopBtn     = document.getElementById("stopBtn");
  const stage       = document.getElementById("stage");
  const video       = document.getElementById("video");
  const canvas      = document.getElementById("eyes");
  const ctx         = canvas.getContext("2d");
  const placeholder = document.getElementById("placeholder");
  const badge       = document.getElementById("badge");
  const statusLine  = document.getElementById("status");

  /* =====================================================================
     SECTION 3: APP STATE
     Everything the app needs to remember between video frames.
     ===================================================================== */
  let faceLandmarker = null;     // the loaded MediaPipe detector (created once, reused)
  let mediaStream = null;        // the live camera stream (null when the camera is off)
  let animationId = 0;           // id of the next scheduled animation frame
  let sessionId = 0;             // goes up on every start/stop so old async work can tell it is out of date
  let lastVideoTime = -1;        // the last video timestamp we analysed (avoids repeating work)
  let lastFrameMs = 0;           // wall-clock time of the last analysed frame, for physics timing

  // Two googly eyes. Each remembers its position, size and pupil physics.
  function makeEyeState() {
    return {
      x: 0, y: 0,            // smoothed eye centre in video pixels
      vx: 0, vy: 0,          // smoothed eye velocity (pixels per second)
      ax: 0, ay: 0,          // eye acceleration (how quickly the velocity changes)
      radius: 0,             // smoothed googly-eye radius in pixels
      px: 0, py: 0,          // pupil position relative to the eye centre, in eye radii
      pvx: 0, pvy: 0         // pupil velocity, in eye radii per second
    };
  }
  let eyes = [makeEyeState(), makeEyeState()];
  let hadFaceLastFrame = false;  // used to restart the physics cleanly when a face (re)appears

  /* =====================================================================
     SECTION 4: STATUS MESSAGES
     One helper keeps the status line, the on-picture badge and the
     placeholder text in sync.
     ===================================================================== */
  function setStatus(message, { isError = false, showBadge = false } = {}) {
    statusLine.textContent = message;                   // screen readers announce this
    statusLine.classList.toggle("error", isError);      // red text for problems
    badge.textContent = message;                        // same words on top of the picture
    badge.hidden = !showBadge;
  }

  /* =====================================================================
     SECTION 5: LOADING THE FACE LANDMARKER
     Done lazily: nothing is downloaded until the first press of Start.
     ===================================================================== */
  async function loadFaceLandmarker() {
    if (faceLandmarker) return faceLandmarker;           // already loaded: reuse it

    // Import the MediaPipe library now (not at page load).
    const vision = await import(MEDIAPIPE_MODULE_URL);
    const { FaceLandmarker, FilesetResolver } = vision;

    // Point the library at its WebAssembly engine files.
    const fileset = await FilesetResolver.forVisionTasks(MEDIAPIPE_WASM_URL);

    // Shared options for the detector.
    const makeOptions = (delegate) => ({
      baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate },
      runningMode: "VIDEO",   // we feed it a continuous video, frame by frame
      numFaces: 1             // we only need one face: yours
    });

    try {
      // Try the graphics card first because it is much faster.
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, makeOptions("GPU"));
    } catch (gpuError) {
      // Some devices have no usable GPU support: fall back to the processor.
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, makeOptions("CPU"));
    }
    return faceLandmarker;
  }

  /* =====================================================================
     SECTION 6: STARTING THE CAMERA
     ===================================================================== */
  async function startCamera() {
    const mySession = ++sessionId;                       // mark this attempt

    // Lock both buttons while we work, so nothing can be pressed twice.
    startBtn.disabled = true;
    stopBtn.disabled = true;
    placeholder.hidden = false;
    placeholder.textContent = "Starting up…";
    setStatus("Loading face tracking. This can take a few seconds the first time…");

    try {
      // Load the face model (only downloads the first time).
      await loadFaceLandmarker();
      if (mySession !== sessionId) return;               // user pressed something else meanwhile

      // Ask the browser for the front camera. The browser shows its own permission prompt.
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false                                     // we never record sound
      });
      if (mySession !== sessionId) {                     // stopped while waiting for permission
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
        return;
      }

      // Show the camera in the video element and wait until it is playing.
      video.srcObject = mediaStream;
      await video.play();
      if (mySession !== sessionId) return;

      // Match the stage shape and canvas resolution to the real camera picture.
      const w = video.videoWidth || 640;
      const h = video.videoHeight || 480;
      canvas.width = w;
      canvas.height = h;
      stage.style.setProperty("--ratio", String(w / h));

      // Reset eye state so nothing carries over from an earlier session.
      eyes = [makeEyeState(), makeEyeState()];
      hadFaceLastFrame = false;
      lastVideoTime = -1;
      lastFrameMs = performance.now();

      // Update the page for "camera is running".
      placeholder.hidden = true;
      stopBtn.disabled = false;
      stopBtn.focus();                                   // keep keyboard focus on a usable button
      setStatus("Looking for a face…", { showBadge: true });

      // Begin the per-frame loop.
      animationId = requestAnimationFrame(frameLoop);
    } catch (error) {
      if (mySession !== sessionId) return;
      handleStartError(error);
    }
  }

  // Turn a technical error into a plain-language message and reset the page.
  function handleStartError(error) {
    releaseCamera();
    let message = "Something went wrong starting the camera. Please try again.";
    if (error && (error.name === "NotAllowedError" || error.name === "SecurityError")) {
      message = "Camera permission was blocked. Allow camera access in your browser, then press Start Camera.";
    } else if (error && error.name === "NotFoundError") {
      message = "No camera was found on this device.";
    } else if (error && error.name === "NotReadableError") {
      message = "The camera is busy. Close other apps using it, then try again.";
    } else if (!window.isSecureContext) {
      message = "The camera needs a secure page (https or localhost).";
    } else if (!faceLandmarker) {
      message = "Could not load the face tracker. Check your internet connection and try again.";
    }
    placeholder.hidden = false;
    placeholder.textContent = "The camera is off. Press Start Camera to begin.";
    setStatus(message, { isError: true });
    startBtn.disabled = false;
    stopBtn.disabled = true;
    startBtn.focus();
  }

  /* =====================================================================
     SECTION 7: STOPPING THE CAMERA
     ===================================================================== */

  // Shuts off the camera hardware, the loop and the drawing.
  function releaseCamera() {
    cancelAnimationFrame(animationId);                   // stop the per-frame loop
    animationId = 0;
    if (mediaStream) {
      mediaStream.getTracks().forEach((track) => track.stop());  // this turns the camera light off
      mediaStream = null;
    }
    video.pause();
    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);    // remove any leftover eyes
    hadFaceLastFrame = false;
  }

  function stopCamera() {
    sessionId++;                                         // invalidates any start still in progress
    releaseCamera();
    placeholder.hidden = false;
    placeholder.textContent = "The camera is off. Press Start Camera to begin.";
    startBtn.disabled = false;
    stopBtn.disabled = true;
    startBtn.focus();
    setStatus("Camera is off.");
  }

  /* =====================================================================
     SECTION 8: THE PER-FRAME LOOP
     Runs once per screen refresh while the camera is on.
     ===================================================================== */
  function frameLoop() {
    animationId = requestAnimationFrame(frameLoop);      // schedule the next frame first

    // Only analyse when the camera has delivered a genuinely new picture.
    if (!faceLandmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
    lastVideoTime = video.currentTime;

    const now = performance.now();
    // Time since the previous analysed frame, in seconds, kept in a sane range.
    const dt = Math.min(Math.max((now - lastFrameMs) / 1000, 1 / 120), 1 / 15);
    lastFrameMs = now;

    // Ask MediaPipe to find the face in this frame.
    const result = faceLandmarker.detectForVideo(video, now);

    // Wipe the previous drawing.
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (result.faceLandmarks && result.faceLandmarks.length > 0) {
      const landmarks = result.faceLandmarks[0];
      updateEyesFromLandmarks(landmarks, dt);
      for (const eye of eyes) drawGooglyEye(eye);
      if (!hadFaceLastFrame) {
        // A face just appeared: replace "Looking…" with a friendly message.
        setStatus("Face found. Wiggle your head!", { showBadge: false });
      }
      hadFaceLastFrame = true;
    } else {
      if (hadFaceLastFrame || badge.hidden) {
        // The face was lost: tell the person, and restart physics when it returns.
        setStatus("Looking for a face…", { showBadge: true });
      }
      hadFaceLastFrame = false;
    }
  }

  /* =====================================================================
     SECTION 9: TURNING FACE LANDMARKS INTO EYE POSITIONS
     ===================================================================== */
  function updateEyesFromLandmarks(landmarks, dt) {
    const w = canvas.width;
    const h = canvas.height;

    // Work out the raw centre of each eye (midpoint between its two corners)
    // and how wide each eye is, in video pixels.
    const raw = [EYE_CORNERS.first, EYE_CORNERS.second].map((pair) => {
      const a = landmarks[pair.a];
      const b = landmarks[pair.b];
      return {
        x: ((a.x + b.x) / 2) * w,
        y: ((a.y + b.y) / 2) * h,
        width: Math.hypot((a.x - b.x) * w, (a.y - b.y) * h)
      };
    });

    // Distance between the two eye centres: used to keep googly eyes from overlapping.
    const eyeGap = Math.hypot(raw[0].x - raw[1].x, raw[0].y - raw[1].y);

    for (let i = 0; i < 2; i++) {
      const eye = eyes[i];
      const target = raw[i];

      // Googly eye radius: scaled to the real eye, but capped by the eye gap.
      const targetRadius = Math.min(
        target.width * EYE_SIZE_FROM_EYE_WIDTH,
        eyeGap * EYE_MAX_SHARE_OF_EYE_GAP
      );

      if (!hadFaceLastFrame) {
        // First frame with a face: jump straight there and start the pupil at rest at the bottom.
        eye.x = target.x;  eye.y = target.y;
        eye.vx = 0;        eye.vy = 0;
        eye.ax = 0;        eye.ay = 0;
        eye.radius = targetRadius;
        eye.px = 0;        eye.py = 0.4;
        eye.pvx = 0;       eye.pvy = 0;
        continue;
      }

      // Smoothly follow the tracked position (reduces landmark jitter).
      const newX = eye.x + (target.x - eye.x) * POSITION_SMOOTHING;
      const newY = eye.y + (target.y - eye.y) * POSITION_SMOOTHING;

      // Work out how fast the eye moved, and how fast that speed changed (acceleration).
      const newVx = (newX - eye.x) / dt;
      const newVy = (newY - eye.y) / dt;
      eye.ax = (newVx - eye.vx) / dt;
      eye.ay = (newVy - eye.vy) / dt;
      eye.vx = newVx;
      eye.vy = newVy;
      eye.x = newX;
      eye.y = newY;

      // Smoothly follow the tracked size.
      eye.radius += (targetRadius - eye.radius) * SIZE_SMOOTHING;

      // Let the pupil react to the movement.
      stepPupilPhysics(eye, dt);
    }
  }

  /* =====================================================================
     SECTION 10: PUPIL PHYSICS
     The pupil is a loose ball inside a circular eye.
     - Gravity pulls it down.
     - When the eye accelerates one way, the pupil is flung the other way
       (the same thing that pushes you back into your seat when a car speeds up).
     - It bounces off the inside wall of the eye and slowly settles.
     Distances here are in "eye radii", so the effect looks the same at any size.
     ===================================================================== */
  function stepPupilPhysics(eye, dt) {
    if (eye.radius < 1) return;

    // Convert the eye's pixel acceleration into eye-radii units, and cap it.
    let shakeX = -(eye.ax / eye.radius) * SHAKE_GAIN;
    let shakeY = -(eye.ay / eye.radius) * SHAKE_GAIN;
    const shakeStrength = Math.hypot(shakeX, shakeY);
    if (shakeStrength > MAX_SHAKE) {
      shakeX *= MAX_SHAKE / shakeStrength;
      shakeY *= MAX_SHAKE / shakeStrength;
    }

    // The farthest the pupil's centre can be from the eye centre before it touches the wall.
    const maxReach = 1 - PUPIL_SIZE;
    const step = dt / PHYSICS_STEPS;

    for (let s = 0; s < PHYSICS_STEPS; s++) {
      // Add up the forces: gravity (down) plus the shake from head movement.
      eye.pvx += shakeX * step;
      eye.pvy += (GRAVITY + shakeY) * step;

      // Air drag slowly removes speed so the wobble settles down.
      const drag = Math.exp(-AIR_DRAG * step);
      eye.pvx *= drag;
      eye.pvy *= drag;

      // Move the pupil.
      eye.px += eye.pvx * step;
      eye.py += eye.pvy * step;

      // Bounce off the inside wall of the eye.
      const dist = Math.hypot(eye.px, eye.py);
      if (dist > maxReach) {
        // Direction pointing from the eye centre to the pupil.
        const nx = eye.px / dist;
        const ny = eye.py / dist;
        // Put the pupil back exactly on the wall.
        eye.px = nx * maxReach;
        eye.py = ny * maxReach;
        // Reflect the part of the speed that was heading into the wall.
        const speedIntoWall = eye.pvx * nx + eye.pvy * ny;
        if (speedIntoWall > 0) {
          eye.pvx -= (1 + BOUNCE) * speedIntoWall * nx;
          eye.pvy -= (1 + BOUNCE) * speedIntoWall * ny;
        }
      }
    }
  }

  /* =====================================================================
     SECTION 11: DRAWING ONE GOOGLY EYE
     White eyeball, thick dark rim, black pupil with a tiny shine.
     (The canvas is mirrored by CSS, so we draw in normal camera coordinates.)
     ===================================================================== */
  function drawGooglyEye(eye) {
    const r = eye.radius;
    if (r < 2) return;

    // Soft drop shadow so the eyes look stuck on the picture.
    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
    ctx.shadowBlur = r * 0.2;
    ctx.shadowOffsetY = r * 0.08;

    // The white of the eye.
    ctx.beginPath();
    ctx.arc(eye.x, eye.y, r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.restore();

    // The dark rim around the eye.
    ctx.beginPath();
    ctx.arc(eye.x, eye.y, r, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(2, r * 0.09);
    ctx.strokeStyle = "#1b1b1b";
    ctx.stroke();

    // The black pupil, placed using the physics position.
    const pupilRadius = r * PUPIL_SIZE;
    const pupilX = eye.x + eye.px * r;
    const pupilY = eye.y + eye.py * r;
    ctx.beginPath();
    ctx.arc(pupilX, pupilY, pupilRadius, 0, Math.PI * 2);
    ctx.fillStyle = "#000000";
    ctx.fill();

    // A tiny white shine on the pupil to make it feel glossy.
    ctx.beginPath();
    ctx.arc(pupilX - pupilRadius * 0.3, pupilY - pupilRadius * 0.35, pupilRadius * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.fill();
  }

  /* =====================================================================
     SECTION 12: BUTTON WIRING AND SAFETY NETS
     ===================================================================== */
  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);

  // If the camera gets unplugged or taken by another app, tidy up politely.
  video.addEventListener("ended", () => { if (mediaStream) stopCamera(); });

  // Release the camera if the page is closed or navigated away.
  window.addEventListener("pagehide", releaseCamera);
</script>
</body>
</html>
