<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80s Synthwave Decision Maker</title>
    <!-- Tailwind CSS CDN for modern responsive utility layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for 80s Arcade & Sci-Fi Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           // v1.3 - 80s Retro Decision Maker Styles
           // Neon Glows, CRT Overlay, Synthwave Grid & Responsive Arcade Theme
           ========================================================================== */

        body {
            font-family: 'VT323', monospace;
            background-color: #0d0221;
            color: #ff007f;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Arcade pixel typography classes */
        .font-arcade {
            font-family: 'Press Start 2P', cursive;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Animated Synthwave Grid Background */
        .synthwave-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 0, 127, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 400px; }
        }

        /* Optional CRT Scanlines Effect Overlay */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Neon Box Container Styling */
        .neon-box {
            border: 3px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 20px rgba(0, 240, 255, 0.25);
            background: rgba(13, 2, 33, 0.92);
            backdrop-filter: blur(4px);
        }

        /* Neon Buttons with Glow & Hover Animations */
        .neon-button-pink {
            border: 3px solid #ff007f;
            color: #ff007f;
            box-shadow: 0 0 10px #ff007f;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: #0d0221;
        }
        .neon-button-pink:hover:not(:disabled) {
            background-color: #ff007f;
            color: #0d0221;
            box-shadow: 0 0 25px #ff007f, 0 0 40px #ff007f;
            transform: translateY(-2px);
        }

        .neon-button-cyan {
            border: 3px solid #00f0ff;
            color: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: #0d0221;
        }
        .neon-button-cyan:hover:not(:disabled) {
            background-color: #00f0ff;
            color: #0d0221;
            box-shadow: 0 0 25px #00f0ff, 0 0 40px #00f0ff;
            transform: translateY(-2px);
        }

        .neon-button-yellow {
            border: 3px solid #ffe600;
            color: #ffe600;
            box-shadow: 0 0 10px #ffe600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: #0d0221;
        }
        .neon-button-yellow:hover:not(:disabled) {
            background-color: #ffe600;
            color: #0d0221;
            box-shadow: 0 0 25px #ffe600, 0 0 40px #ffe600;
            transform: translateY(-2px);
        }

        .neon-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none !important;
            transform: none !important;
        }

        /* Neon Input Field Styling */
        .neon-input {
            background: #190033;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            box-shadow: inset 0 0 8px rgba(0, 240, 255, 0.4);
        }
        .neon-input:focus {
            outline: none;
            border-color: #ff007f;
            box-shadow: inset 0 0 12px #ff007f, 0 0 15px #ff007f;
        }

        /* Glow Text Shadows */
        .neon-text-pink {
            text-shadow: 0 0 8px #ff007f, 0 0 20px #ff007f;
        }
        .neon-text-cyan {
            text-shadow: 0 0 8px #00f0ff, 0 0 20px #00f0ff;
        }
        .neon-text-yellow {
            text-shadow: 0 0 8px #ffe600, 0 0 20px #ffe600;
        }

        /* Winner Celebration Pulse Animation */
        @keyframes pulseGlow {
            0% { transform: scale(1); text-shadow: 0 0 10px #ff007f, 0 0 30px #ff007f; }
            50% { transform: scale(1.06); text-shadow: 0 0 20px #00f0ff, 0 0 50px #00f0ff, 0 0 80px #ffe600; }
            100% { transform: scale(1); text-shadow: 0 0 10px #ff007f, 0 0 30px #ff007f; }
        }
        .winner-animation {
            animation: pulseGlow 0.8s infinite ease-in-out;
        }

        /* Scrollbar styling for options list */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0221;
            border: 1px solid #00f0ff;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff007f;
            box-shadow: 0 0 10px #ff007f;
        }
    </style>
</head>
<body class="synthwave-grid flex flex-col justify-between p-4 sm:p-8">

    <!-- CRT Visual Scanline Layer -->
    <div class="crt-overlay" aria-hidden="true"></div>

    <header class="text-center my-6 z-10">
        <h1 class="font-arcade text-2xl sm:text-4xl lg:text-5xl text-cyan-400 neon-text-cyan mb-3 tracking-wider">
            RETRO DECIDER
        </h1>
        <p class="font-orbitron text-lg sm:text-2xl text-pink-500 neon-text-pink tracking-widest font-bold">
            INSERT COIN &bull; CHOOSE YOUR DESTINY
        </p>
    </header>

    <main class="w-full max-w-3xl mx-auto neon-box rounded-2xl p-5 sm:p-8 mb-8 flex-grow flex flex-col justify-between z-10 shadow-2xl">
        <div>
            <!-- Top Controls Header & Sound Toggle -->
            <div class="flex justify-between items-center mb-6 pb-2 border-b border-cyan-800">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-pink-500 animate-pulse"></span>
                    <span class="font-orbitron text-xl text-cyan-300">OPTION MATRIX</span>
                </div>
                <div class="flex items-center gap-3">
                    <button 
                        id="sound-toggle-btn" 
                        class="neon-button-cyan text-xs font-arcade px-3 py-2 rounded focus:outline-none"
                        aria-label="Toggle Sound Effects"
                    >
                        SOUND: ON 🔊
                    </button>
                    <button 
                        id="share-btn" 
                        class="neon-button-yellow text-xs font-arcade px-3 py-2 rounded focus:outline-none flex items-center gap-1"
                        aria-label="Copy Shareable Link with options"
                    >
                        🔗 COPY LINK
                    </button>
                </div>
            </div>

            <!-- Input Form for adding new options -->
            <form id="option-form" class="flex flex-col sm:flex-row gap-3 mb-6" aria-label="Add New Option Form">
                <label for="option-input" class="sr-only">Type a decision option</label>
                <input 
                    type="text" 
                    id="option-input" 
                    class="neon-input flex-grow px-4 py-3 rounded-lg text-2xl placeholder-cyan-700 tracking-wide font-mono" 
                    placeholder="TYPE OPTION (e.g. Pierogies)..." 
                    autocomplete="off"
                    maxlength="50"
                    required
                >
                <button 
                    type="submit" 
                    class="neon-button-pink font-arcade text-xs sm:text-sm px-6 py-4 rounded-lg bg-black uppercase font-bold tracking-widest"
                    aria-label="Add Option"
                >
                    + ADD
                </button>
            </form>

            <!-- Retro Notification Banner / Alert Box -->
            <div 
                id="message-box" 
                class="hidden p-4 mb-6 rounded-lg border-2 border-yellow-400 bg-yellow-950 bg-opacity-80 text-yellow-300 text-2xl text-center font-orbitron tracking-wide shadow-lg" 
                role="alert"
                aria-live="assertive"
            ></div>

            <!-- Toast Notification for Share Link -->
            <div 
                id="toast-box" 
                class="hidden fixed top-6 right-6 z-50 p-4 rounded-lg border-2 border-cyan-400 bg-black bg-opacity-95 text-cyan-300 text-xl font-orbitron shadow-2xl neon-text-cyan flex items-center gap-2" 
                role="status"
                aria-live="polite"
            >
                <span>✨ LINK COPIED TO CLIPBOARD!</span>
            </div>

            <!-- Options Count & Clear All Bar -->
            <div class="flex justify-between items-center mb-3 text-2xl">
                <span class="text-cyan-400 font-orbitron">
                    TOTAL OPTIONS: <span id="option-count" class="text-pink-400 font-bold">0</span>
                </span>
                <button 
                    id="clear-all-btn" 
                    class="text-xl text-pink-500 hover:text-pink-300 underline font-orbitron hidden cursor-pointer focus:outline-none" 
                    aria-label="Clear all options from list"
                >
                    CLEAR ALL
                </button>
            </div>

            <!-- Options List Container -->
            <ul id="options-list" class="space-y-3 max-h-64 overflow-y-auto pr-2 mb-6" aria-label="Current list of options">
                <!-- Dynamically populated options list items -->
            </ul>
        </div>

        <!-- Decision Section & Winner Display -->
        <div class="mt-4 pt-4 border-t border-cyan-800">
            <button 
                id="decide-btn" 
                class="w-full font-arcade text-sm sm:text-lg py-5 px-6 rounded-xl neon-button-cyan text-cyan-300 bg-black cursor-pointer uppercase font-bold tracking-widest transition-transform duration-150"
                aria-label="Decide a random option"
            >
                ⚡ DECIDE MY DESTINY ⚡
            </button>

            <!-- Winner Display Box -->
            <div 
                id="winner-container" 
                class="mt-6 p-6 rounded-2xl border-4 border-pink-500 bg-black bg-opacity-90 text-center hidden shadow-2xl transition-all" 
                aria-live="polite"
            >
                <p class="font-arcade text-xs sm:text-sm text-yellow-400 mb-2 tracking-widest uppercase">
                    🏆 DESTINY HAS SPOKEN 🏆
                </p>
                <div 
                    id="winner-display" 
                    class="font-arcade text-2xl sm:text-4xl text-pink-500 neon-text-pink break-words py-4 tracking-wide"
                ></div>
            </div>
        </div>
    </main>

    <footer class="text-center text-cyan-600 text-lg mb-2 font-orbitron z-10">
        <p>&copy; 198X SYNTHWAVE DECISION CORP &bull; ALL RIGHTS RESERVED</p>
    </footer>

    <script>
        // ==========================================================================
        // v1.3 - Vanilla JS Logic for 80s Synthwave Decision Maker
        // Features:
        // 1. Web Audio API synthesized 80s arcade sound effects
        // 2. URL Search Query parsing (?options=Pierogies,Takeout,Pizza) on boot
        // 3. Share button with navigator.clipboard / fallback URL generation
        // 4. Smooth 2-second prize-wheel / slot-machine decelerating random picker
        // ==========================================================================

        document.addEventListener('DOMContentLoaded', () => {
            // Main application state holding option strings
            let options = [];
            let soundEnabled = true;

            // Audio Context for synthesizing retro arcade sounds without external assets
            let audioCtx = null;

            // DOM References
            const optionForm = document.getElementById('option-form');
            const optionInput = document.getElementById('option-input');
            const optionsList = document.getElementById('options-list');
            const optionCount = document.getElementById('option-count');
            const decideBtn = document.getElementById('decide-btn');
            const shareBtn = document.getElementById('share-btn');
            const soundToggleBtn = document.getElementById('sound-toggle-btn');
            const winnerContainer = document.getElementById('winner-container');
            const winnerDisplay = document.getElementById('winner-display');
            const messageBox = document.getElementById('message-box');
            const toastBox = document.getElementById('toast-box');
            const clearAllBtn = document.getElementById('clear-all-btn');

            /**
             * Helper function to play synthesized 80s arcade beep sounds
             * @param {number} frequency - Beep tone frequency in Hz
             * @param {string} type - Waveform type ('square', 'sawtooth', 'sine')
             * @param {number} duration - Tone duration in seconds
             */
            function playRetroBeep(frequency = 440, type = 'square', duration = 0.08) {
                if (!soundEnabled) return;
                try {
                    if (!audioCtx) {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (err) {
                    // Audio fail-safe for restricted browser autoplay policies
                }
            }

            /**
             * Play a retro victory chime when winner is revealed
             */
            function playVictoryChime() {
                if (!soundEnabled) return;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25]; // C E G C E synth arpeggio
                notes.forEach((freq, i) => {
                    setTimeout(() => {
                        playRetroBeep(freq, 'triangle', 0.2);
                    }, i * 90);
                });
            }

            /**
             * Parse query parameters on load (e.g. ?options=Pierogies,Takeout,Pizza)
             */
            function parseUrlOptions() {
                const urlParams = new URLSearchParams(window.location.search);
                const optionsParam = urlParams.get('options');

                if (optionsParam) {
                    // Split comma-separated string and clean each entry
                    const parsedOptions = optionsParam
                        .split(',')
                        .map(opt => decodeURIComponent(opt.trim()))
                        .filter(opt => opt.length > 0);

                    if (parsedOptions.length > 0) {
                        options = [...new Set(parsedOptions)]; // Deduplicate
                        showToast(`LOADED ${options.length} OPTIONS FROM URL!`);
                    }
                }
            }

            /**
             * Displays temporary alert banners for validation messages
             * @param {string} text - Message content
             */
            function showMessage(text) {
                messageBox.textContent = text;
                messageBox.classList.remove('hidden');
                playRetroBeep(180, 'sawtooth', 0.25);
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 4000);
            }

            /**
             * Displays brief floating toast notification
             * @param {string} text - Notification message
             */
            function showToast(text) {
                toastBox.firstElementChild.textContent = text;
                toastBox.classList.remove('hidden');
                setTimeout(() => {
                    toastBox.classList.add('hidden');
                }, 2500);
            }

            /**
             * Re-renders options list DOM and updates count
             */
            function renderOptions() {
                optionsList.innerHTML = '';
                optionCount.textContent = options.length;

                // Toggle Clear All button visibility
                if (options.length > 0) {
                    clearAllBtn.classList.remove('hidden');
                } else {
                    clearAllBtn.classList.add('hidden');
                }

                // Placeholder state when list is empty
                if (options.length === 0) {
                    const emptyItem = document.createElement('li');
                    emptyItem.className = 'text-cyan-600 text-center py-6 text-2xl font-orbitron italic border border-cyan-900 border-dashed rounded-lg';
                    emptyItem.textContent = 'NO OPTIONS ADDED YET. TYPE ABOVE TO BEGIN!';
                    optionsList.appendChild(emptyItem);
                    return;
                }

                // Render each list item
                options.forEach((option, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center bg-[#15002a] border border-cyan-700 px-4 py-3 rounded-xl text-2xl text-cyan-300 hover:border-pink-500 transition-colors shadow-md';
                    
                    const span = document.createElement('span');
                    span.className = 'break-all pr-3 font-mono';
                    span.textContent = `${index + 1}. ${option}`;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'neon-button-pink font-arcade text-xs px-3 py-2 rounded-lg bg-black cursor-pointer flex-shrink-0';
                    deleteBtn.textContent = 'REMOVE ✕';
                    deleteBtn.setAttribute('aria-label', `Remove option ${option}`);
                    
                    deleteBtn.addEventListener('click', () => {
                        removeOption(index);
                    });

                    li.appendChild(span);
                    li.appendChild(deleteBtn);
                    optionsList.appendChild(li);
                });
            }

            /**
             * Handler to add a new option from text input
             */
            function handleAddOption(e) {
                e.preventDefault();
                const text = optionInput.value.trim();
                
                if (text === '') return;

                if (options.includes(text)) {
                    showMessage('THAT OPTION ALREADY EXISTS, RADICAL PLAYER!');
                    return;
                }

                options.push(text);
                optionInput.value = '';
                winnerContainer.classList.add('hidden');
                playRetroBeep(600, 'square', 0.08);
                renderOptions();
                optionInput.focus();
            }

            /**
             * Remove an option by index
             */
            function removeOption(index) {
                options.splice(index, 1);
                winnerContainer.classList.add('hidden');
                playRetroBeep(220, 'square', 0.1);
                renderOptions();
            }

            /**
             * Clear all options
             */
            function clearAllOptions() {
                options = [];
                winnerContainer.classList.add('hidden');
                playRetroBeep(150, 'sawtooth', 0.2);
                renderOptions();
            }

            /**
             * Generate URL with current options formatted as ?options=A,B,C and copy to clipboard
             */
            function handleCopyLink() {
                if (options.length === 0) {
                    showMessage('ADD AT LEAST ONE OPTION BEFORE GENERATING A SHARE LINK!');
                    return;
                }

                // Encode options into comma-separated query string
                const encodedOptions = options.map(opt => encodeURIComponent(opt)).join(',');
                const shareableUrl = `${window.location.origin}${window.location.pathname}?options=${encodedOptions}`;

                // Use document.execCommand fallback or navigator.clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareableUrl).then(() => {
                        showToast('✨ LINK COPIED TO CLIPBOARD!');
                        playRetroBeep(880, 'sine', 0.15);
                    }).catch(() => {
                        fallbackCopyText(shareableUrl);
                    });
                } else {
                    fallbackCopyText(shareableUrl);
                }
            }

            /**
             * Clipboard copy fallback using hidden textarea & execCommand
             */
            function fallbackCopyText(text) {
                const dummyInput = document.createElement('textarea');
                dummyInput.value = text;
                document.body.appendChild(dummyInput);
                dummyInput.select();
                try {
                    document.execCommand('copy');
                    showToast('✨ LINK COPIED TO CLIPBOARD!');
                    playRetroBeep(880, 'sine', 0.15);
                } catch (err) {
                    showMessage('COULD NOT AUTO-COPY. COPY URL DIRECTLY FROM ADDRESS BAR.');
                }
                document.body.removeChild(dummyInput);
            }

            /**
             * Dynamic Decision Slot Machine / Wheel Flicking Animation (~2s duration with slowdown)
             */
            function handleDecide() {
                if (options.length < 2) {
                    showMessage('POLITE NOTICE: PLEASE ADD AT LEAST 2 OPTIONS TO DECIDE!');
                    winnerContainer.classList.add('hidden');
                    return;
                }

                // Lock decision button during animation
                decideBtn.disabled = true;
                winnerContainer.classList.remove('hidden');
                winnerDisplay.classList.remove('winner-animation');

                // Pre-calculate winning item
                const finalWinnerIndex = Math.floor(Math.random() * options.length);
                const finalWinner = options[finalWinnerIndex];

                // Animation timing state variables
                let currentIndex = 0;
                let currentDelay = 40;        // Initial rapid speed (40ms ticks)
                const maxDelay = 350;          // Final slowed speed (350ms tick)
                const targetDuration = 2000;   // ~2 seconds total flicker time
                let elapsedTime = 0;

                function stepWheel() {
                    // Move to next option
                    currentIndex = (currentIndex + 1) % options.length;
                    winnerDisplay.textContent = options[currentIndex];

                    // Play rhythmic ticker sound
                    playRetroBeep(400 + (currentIndex * 40), 'square', 0.04);

                    elapsedTime += currentDelay;

                    // Gradually increase delay time to simulate friction/slowing down
                    if (elapsedTime < targetDuration) {
                        currentDelay = Math.min(maxDelay, currentDelay * 1.14);
                        setTimeout(stepWheel, currentDelay);
                    } else {
                        // Land cleanly on final winner
                        winnerDisplay.textContent = finalWinner;
                        winnerDisplay.classList.add('winner-animation');
                        playVictoryChime();
                        decideBtn.disabled = false;
                    }
                }

                // Start decision wheel
                stepWheel();
            }

            // Toggle Sound Mute
            soundToggleBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundToggleBtn.textContent = soundEnabled ? 'SOUND: ON 🔊' : 'SOUND: OFF 🔇';
            });

            // Register Event Listeners
            optionForm.addEventListener('submit', handleAddOption);
            decideBtn.addEventListener('click', handleDecide);
            shareBtn.addEventListener('click', handleCopyLink);
            clearAllBtn.addEventListener('click', clearAllOptions);

            // Startup initialization
            parseUrlOptions();
            renderOptions();
        });
    </script>
</body>
</html>
