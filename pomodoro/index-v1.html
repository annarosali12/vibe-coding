<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time To Work</title>
    <!--
        25-Minute Countdown Timer
        // v1.0 - initial build
        
        A standalone, single-file Pomodoro-style timer app.
        - Responsive layout for mobile, tablet, and desktop.
        - Very large typography readable from across the room.
        - Keyboard and screen-reader accessible.
        - Pure vanilla JavaScript, HTML, and CSS (no external dependencies, frameworks, or tracking).
    -->
    <style>
        /* CSS RESET & BASE STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212; /* Dark background to conserve energy and reduce glare */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            text-align: center;
        }

        /* MAIN CONTAINER */
        main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        /* ACCESSIBLE SCREEN-READER ONLY CLASS */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* TIMER DISPLAY
           Uses viewport units (vw) and container sizing so text is visible from across a room. */
        .timer-display {
            font-size: clamp(5rem, 22vw, 16rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums; /* Prevents text shifting as numbers change */
            line-height: 1;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            user-select: none;
        }

        /* STATUS TEXT ABOVE TIMER */
        .status-text {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            font-weight: 600;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 3px;
            min-height: 1.5em; /* Holds space when empty to avoid layout jump */
        }

        /* BUTTON CONTAINER */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 700px;
            margin-top: 1rem;
        }

        /* BASE BUTTON STYLES */
        .btn {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 700;
            padding: 0.8em 1.6em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: transform 0.1s ease, background-color 0.2s ease, opacity 0.2s ease;
            min-width: 140px;
            flex: 1 1 30%; /* Responsive sizing across screen widths */
        }

        /* Hover and focus accessibility effects */
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn:focus-visible {
            outline: 4px solid #ffffff;
            outline-offset: 4px;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* BUTTON COLOR VARIANTS */
        .btn-start {
            background-color: #2e7d32; /* Green */
            color: #ffffff;
        }

        .btn-pause {
            background-color: #ed6c02; /* Orange */
            color: #ffffff;
        }

        .btn-reset {
            background-color: #c62828; /* Red */
            color: #ffffff;
        }

        /* MEDIA QUERIES FOR SMALL MOBILE SCREENS */
        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
                gap: 1rem;
            }
            .btn {
                width: 100%;
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

    <main>
        <!-- Status indicator for visual context and screen readers -->
        <div id="statusText" class="status-text" aria-live="polite">Ready</div>

        <!-- Large countdown timer display -->
        <div id="timerDisplay" class="timer-display" aria-label="Timer display">25:00</div>

        <!-- Hidden live region to announce time updates to screen readers periodically -->
        <div id="srAnnouncement" class="sr-only" aria-live="assertive"></div>

        <!-- Control Buttons -->
        <div class="button-group">
            <button id="startBtn" class="btn btn-start" aria-label="Start Timer">Start</button>
            <button id="pauseBtn" class="btn btn-pause" aria-label="Pause Timer" disabled>Pause</button>
            <button id="resetBtn" class="btn btn-reset" aria-label="Reset Timer">Reset</button>
        </div>
    </main>

    <script>
        // v1.0 - initial build

        /* ==========================================================================
           STATE MANAGEMENT & CONSTANTS
           ========================================================================== */
        
        // Total duration for the timer set to 25 minutes (in seconds)
        const INITIAL_TIME_IN_SECONDS = 25 * 60; 

        // Variable to hold the remaining time in seconds
        let timeRemaining = INITIAL_TIME_IN_SECONDS; 

        // Variable to hold the ID of the active interval (null when timer is stopped)
        let timerInterval = null; 

        /* ==========================================================================
           DOM ELEMENTS
           Fetching references to HTML elements used in the script.
           ========================================================================== */
        const timerDisplay = document.getElementById('timerDisplay');
        const statusText = document.getElementById('statusText');
        const srAnnouncement = document.getElementById('srAnnouncement');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        /* ==========================================================================
           HELPER FUNCTIONS
           ========================================================================== */

        /**
         * Formats total seconds into a MM:SS string layout.
         * Example: 1500 seconds becomes "25:00".
         */
        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            // Pad start with '0' to ensure two digits for minutes and seconds
            const paddedMinutes = String(minutes).padStart(2, '0');
            const paddedSeconds = String(seconds).padStart(2, '0');

            return `${paddedMinutes}:${paddedSeconds}`;
        }

        /**
         * Updates the text displayed on the screen and in the browser tab title.
         */
        function updateDisplay() {
            const formattedTime = formatTime(timeRemaining);
            
            // Update main large timer display
            timerDisplay.textContent = formattedTime;

            // Update browser tab title so users can monitor time from other tabs
            document.title = `${formattedTime} - Time-To-Work`;
        }

        /**
         * Safely announces messages to screen reader users using a hidden live region.
         */
        function announceToScreenReader(message) {
            srAnnouncement.textContent = message;
        }

        /* ==========================================================================
           TIMER LOGIC & CONTROLS
           ========================================================================== */

        /**
         * Starts the countdown sequence.
         */
        function startTimer() {
            // Guard clause: prevent starting multiple intervals if already running
            if (timerInterval !== null) return;

            // Update state status UI
            statusText.textContent = "Running";
            
            // Toggle button interactive states
            startBtn.disabled = true;
            pauseBtn.disabled = false;

            // Voice announcement for accessible devices
            announceToScreenReader("Timer started. 25 minutes remaining.");

            // Create an interval that executes every 1000 milliseconds (1 second)
            timerInterval = setInterval(() => {
                timeRemaining--;

                // Refresh the visually displayed timer
                updateDisplay();

                // Announce time remaining to screen readers at key milestones
                if (timeRemaining > 0 && timeRemaining % 300 === 0) { // Every 5 minutes
                    const minsLeft = timeRemaining / 60;
                    announceToScreenReader(`${minsLeft} minutes remaining.`);
                }

                // Check if the timer has reached zero
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    
                    // Final state adjustments
                    statusText.textContent = "Time's Up!";
                    startBtn.disabled = true;
                    pauseBtn.disabled = true;
                    
                    announceToScreenReader("Time is up! The 25 minute timer has finished.");
                }
            }, 1000);
        }

        /**
         * Pauses the active countdown sequence.
         */
        function pauseTimer() {
            // Guard clause: do nothing if the timer isn't running
            if (timerInterval === null) return;

            // Stop the countdown execution interval
            clearInterval(timerInterval);
            timerInterval = null;

            // Update state status UI
            statusText.textContent = "Paused";

            // Toggle button interactive states
            startBtn.disabled = false;
            pauseBtn.disabled = true;

            announceToScreenReader(`Timer paused at ${formatTime(timeRemaining)}.`);
        }

        /**
         * Resets the timer back to its initial state of 25:00.
         */
        function resetTimer() {
            // Clear any active running interval
            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // Reset time state back to default 25 minutes
            timeRemaining = INITIAL_TIME_IN_SECONDS;

            // Reset visual elements to starting state
            updateDisplay();
            statusText.textContent = "Ready";

            // Enable start button, disable pause button
            startBtn.disabled = false;
            pauseBtn.disabled = true;

            announceToScreenReader("Timer reset to 25 minutes.");
        }

        /* ==========================================================================
           EVENT LISTENERS & INITIALIZATION
           ========================================================================== */

        // Attach click handlers to respective control buttons
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Render the default time display immediately when loaded
        updateDisplay();
    </script>
</body>
</html>
